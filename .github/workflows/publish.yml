name: Publish to PyPI & MCP Registry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 三段发布，均免 token：
# 1) PyPI 可信发布(Trusted Publishing / OIDC)：
#    前置：在 pypi.org 项目 kingdee-mcp → Manage → Publishing 添加可信发布者，
#          配置 Owner=geekx, Repository=Kingdee-Ontology, Workflow=publish.yml,
#          Environment=(空)。仓库改过名/换过 owner 时这里要跟着改，否则
#          twine 会报 TrustedPublishingFailure: invalid-publisher
#          （OIDC claims 跟 PyPI 登记的不匹配）——这是本仓库踩过的真实坑：
#          PyPI 收到的 OIDC claims（当前仓库 owner/repo/workflow 路径）跟
#          它那边登记的可信发布者对不上，最常见原因是仓库改过名或转过
#          owner（本仓库经历过 WaHaiLong/KingdeeMCP → geekx/Kingdee-
#          Ontology），但 pypi.org 上的登记没跟着更新。改代码/工作流修不了
#          这个——去 pypi.org 项目页把登记信息改成上面这行，跟仓库当前的
#          真实 owner/repo 对齐。
# 2) GitHub Release：把这次发布正式登在仓库首页，方便不想走 PyPI/uvx 的用户
#    直接下载 wheel/sdist，同一份 dist/ 产物复用，不重新编译。
# 3) 官方 MCP Registry (registry.modelcontextprotocol.io)：
#    用 GitHub OIDC 登录（mcp-publisher login github-oidc），无需任何 secret。
#    命名空间 io.github.geekx/* 由本仓库所有者身份自动授权——同理，仓库换了
#    owner，server.json 里的 name 字段必须跟着改，否则这一步也会被拒绝。
# 前两者依赖 `contents: write`，PyPI 与 Registry 依赖 `id-token: write`。
permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build & twine
        run: python -m pip install --upgrade build twine

      # 只在这一步编译一次：下面 PyPI 发布和同步 GitHub Release 用的是
      # 同一份 dist/ 产物，不为了"发到两个地方"就编译两次——既浪费
      # Actions 分钟数，也可能让两边拿到不完全一样的构建。
      - name: Build distributions
        run: python -m build

      - name: Publish to PyPI (Trusted Publishing, no token)
        run: twine upload dist/*

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "解析出的版本号：${VERSION}"

      # 同步同一份 dist/ 到 GitHub Release，方便不想走 PyPI/uvx 的用户直接
      # 下载 wheel/sdist。只在真实的 tag push 时才建 Release——
      # workflow_dispatch 手动重跑（比如排查发布问题）不会平白造一个 Release。
      - name: 同步到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            完整变更说明见 [CHANGELOG.md](https://github.com/geekx/Kingdee-Ontology/blob/main/CHANGELOG.md)。

            ```bash
            pip install kingdee-mcp
            # 或
            uvx kingdee-mcp                        # legacy 101 工具
            uvx --from kingdee-mcp kingdee-ontology # 本体底座 11 工具
            ```

      # ---------- 以下为官方 MCP Registry 上架 ----------

      - name: Sync version into server.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V='${{ steps.ver.outputs.version }}'
          jq --arg v "$V" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          cat server.json

      # 注册表会去 PyPI 拉取包描述校验 mcp-name 标记，
      # 刚上传的版本需要几十秒才可查，这里轮询等待，避免 "Package validation failed"。
      - name: Wait for PyPI to index the new version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V='${{ steps.ver.outputs.version }}'
          for i in $(seq 1 30); do
            FOUND=$(curl -sf "https://pypi.org/pypi/kingdee-mcp/${V}/json" -o /dev/null -w "%{http_code}" || true)
            if [ "$FOUND" = "200" ]; then
              echo "PyPI 已索引 ${V}（第 ${i} 次探测）"
              exit 0
            fi
            echo "等待 PyPI 索引 ${V} ... (${i}/30)"
            sleep 10
          done
          echo "::error::PyPI 在 5 分钟内仍未索引 ${V}，跳过注册表发布。可稍后手动重跑本工作流。"
          exit 1

      - name: Install mcp-publisher
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC, no secret)
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./mcp-publisher publish
